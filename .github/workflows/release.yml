name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version in x.x.x format
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match x.x.x" >&2
            exit 1
          fi

      - name: Check the loader source
        run: |
          if [[ ! -s loader/badges_sdk.py ]]; then
            echo "loader/badges_sdk.py is missing" >&2
            exit 1
          fi

      - name: Ensure Telegram JARs exist
        run: |
          for jar in libs/Telegram.jar libs/Telegram-compile.jar; do
            if [[ ! -s "$jar" ]]; then
              echo "$jar is missing. Commit the host JARs to libs/ (see 'just update-apk')." >&2
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "build-tools;36.1.0" "platforms;android-36.1"

      - name: Point Gradle to runner Android SDK
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Bump SDK version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python scripts/prepare_release.py \
            --version "$VERSION" \
            --loader-file loader/badges_sdk.py \
            --pyproject-file pyproject.toml

      - name: Build the release artifacts
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x gradlew
          release_dir="$RUNNER_TEMP/release"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          just ci-release "$VERSION" "$release_dir"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/release/badges-sdk-loader.py
            ${{ runner.temp }}/release/badges-sdk.dex
            ${{ runner.temp }}/release/badges-sdk-compat.aar

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add loader/badges_sdk.py pyproject.toml
          git diff --cached --quiet && {
            echo "No plugin metadata changes to commit" >&2
            exit 1
          }
          git commit -m "release: ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists" >&2
            exit 1
          fi
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          release_dir="$RUNNER_TEMP/release"
          gh release create "$VERSION" \
            "$release_dir/badges-sdk-loader.py#badges-sdk-loader.py" \
            "$release_dir/badges-sdk.dex#badges-sdk.dex" \
            "$release_dir/badges-sdk-compat.aar#badges-sdk-compat.aar" \
            --title "$VERSION" \
            --notes ""
